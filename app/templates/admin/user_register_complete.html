{% extends 'layouts/base.html' %}

{# アカウント一覧の子画面（一覧へ戻ると履歴を戻る） #}
{% block nav_parent %}{{ url_for('admin.user_list') }}{% endblock %}

{% block layout %}
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0">
        <div class="card-body text-center p-5">
            <!-- 完了アイコン -->
            <div class="mb-4 text-success">
                <i class="bi bi-check-circle-fill" style="font-size: 3.5rem;"></i>
            </div>

            <h3 class="fw-bold mb-3">職員アカウントの登録が完了しました</h3>
            <p class="text-muted mb-4">
                新しい職員アカウントが正常に登録されました。<br>
                アカウント一覧から確認・管理が可能です。
            </p>

            <!-- 一覧・ポータルへ戻るボタン -->
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <a href="{{ url_for('admin.user_list') }}" class="btn btn-primary px-4" data-nav="replace">
                    アカウント一覧へ戻る
                </a>
                <a href="{{ url_for('admin.portal') }}" class="btn btn-outline-secondary px-4" data-nav="replace">
                    システム管理ポータルへ戻る
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
