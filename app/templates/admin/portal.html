{% extends 'layouts/base.html' %}

{% block layout %}
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary px-4">
    <span class="navbar-brand fw-bold"><i class="bi bi-gear-fill me-2"></i>システム管理ポータル</span>
    <div class="ms-auto d-flex align-items-center text-white">
        <!-- モーダル呼び出しボタン -->
        <button type="button" class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#systemAdminLogoutModal">
            ログアウト
        </button>
    </div>

</nav>

<div class="container-fluid p-4">
    <h4 class="fw-bold mb-4">システム設定・管理</h4>
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold py-3">ユーザー・職員アカウント管理</div>
                <div class="card-body">
                    <a href="#" class="btn btn-primary btn-sm mb-3">+ 新規職員アカウント登録</a>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0"><span>鈴木 健一 (道路維持課)</span><span class="badge bg-success">有効</span></li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0"><span>佐藤 花子 (都市公園課)</span><span class="badge bg-success">有効</span></li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold py-3">部署・カテゴリー・AI判定設定</div>
                <div class="card-body">
                    <p class="small text-muted mb-3">報告カテゴリと自動割り当て部署のマッピング設定</p>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0"><span>道路の破損・陥没</span><strong>→ 道路維持課</strong></li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0"><span>公園の設備故障</span><strong>→ 都市公園課</strong></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- システム管理者用 ログアウト確認モーダル -->
<div class="modal fade" id="systemAdminLogoutModal" tabindex="-1" aria-labelledby="systemAdminLogoutModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold text-dark" id="systemAdminLogoutModalLabel">ログアウト確認</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
            </div>
            <div class="modal-body py-4 text-center fs-6 text-dark">
                ログアウトしますか？
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                <a href="{{ url_for('auth.logout') }}" class="btn btn-danger px-4">ログアウト</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
