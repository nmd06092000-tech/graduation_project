{% extends 'layouts/base.html' %}

{% block layout %}
<div class="container py-5 report-page">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            <div class="card border-0 shadow report-content">
                <div class="card-body p-4">
                    <h4 class="fw-bold text-primary mb-3"><i class="bi bi-pencil-square me-2"></i>困りごとを報告する</h4>
                    {# 入力項目は reports（title・address・latitude・longitude・description）と report_photos に対応する #}
                    <form action="{{ url_for('citizen.report_new') }}" method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="title" class="form-label small fw-bold">件名 <span class="text-danger">*</span></label>
                            <input type="text" id="title" name="title" class="form-control" maxlength="100" required
                                   placeholder="例) 道路に大きな穴が開いている">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">写真撮影</label>
                            {# 撮影 → 写真の確認 → 位置情報の確認 の順に進み、推定した住所を持って報告画面に戻る #}
                            <a href="{{ url_for('citizen.report_camera') }}" class="btn btn-primary w-100 mb-2">📷 写真を撮影する</a>
                            <label for="photos" class="form-label small fw-bold">写真添付（3枚まで）</label>
                            <input type="file" id="photos" name="photos" class="form-control" accept="image/*" multiple>
                        </div>
                        <div class="mb-3">
                            <label for="address" class="form-label small fw-bold">発生場所 <span class="text-danger">*</span></label>
                            <input type="text" id="address" name="address" class="form-control" maxlength="255" required
                                   value="{{ address or '' }}" placeholder="例) 埼玉県さいたま市大宮区高鼻町1丁目 付近">
                            {# 緯度・経度は位置情報の取得（report_form.js）で設定する #}
                            <input type="hidden" id="latitude" name="latitude">
                            <input type="hidden" id="longitude" name="longitude">
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label small fw-bold">詳細内容 <span class="text-danger">*</span></label>
                            <textarea id="description" name="description" class="form-control" rows="4" maxlength="1000" required
                                      placeholder="状況を入力してください（いつから・大きさ・危険の有無など）"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">送信する</button>
                    </form>
                </div>
            </div>

            <div class="text-center mt-3">
                <a href="{{ url_for('citizen.mypage') }}" class="small text-muted text-decoration-none">← マイページに戻る</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
