{% extends 'layouts/base.html' %}

{% block layout %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5 text-center">
                    <!-- 緑色(bg-success)から青色(bg-primary)に変更 -->
                    <div class="bg-primary text-white rounded-circle d-inline-flex p-3 mb-4">
                        <i class="bi bi-check-circle fs-1"></i>
                    </div>

                    <h3 class="fw-bold mb-3">パスワード再設定完了</h3>
                    <p class="text-muted small mb-4">
                        パスワードの変更が完了しました。<br>
                        新しいパスワードでログインしてください。
                    </p>

                    <a href="{{ url_for('auth.login_citizen') }}" class="btn btn-primary w-100 py-2 fw-bold">
                        ログイン画面へ進む
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
