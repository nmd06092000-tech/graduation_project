{% extends 'layouts/base.html' %}

{% block layout %}
<div class="container my-5 reset-password-container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-3">
                <div class="bg-primary text-white rounded-circle d-inline-flex p-3 mb-2">
                    <i class="bi bi-key fs-1"></i>
                </div>
                <h3 class="fw-bold">県民パスワードの再設定</h3>
                <p class="text-muted small">ご登録のメールアドレスを入力してください。<br>パスワード再設定用のリンクをメールでお送りします。</p>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <!-- メッセージ表示エリア（サーバー側のメッセージ・画面側の入力チェック） -->
                    <div id="input-errors">
                        {% include 'components/_flash.html' %}
                    </div>

                    <form action="{{ url_for('auth.reset_password') }}" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-4">
                            <label for="email" class="form-label small fw-bold">メールアドレス</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" name="email" class="form-control" placeholder="例) taro@example.com" autocomplete="email" value="{{ email or '' }}" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">再設定メールを送信する</button>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="{{ url_for('auth.login_citizen') }}" class="small text-muted text-decoration-none">← ログイン画面に戻る</a>
            </div>
        </div>
    </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.querySelector('form');
    const emailInput = document.getElementById('email');
    const errorArea = document.getElementById('input-errors');

    // 未入力チェック（ログイン画面と同じく、ブラウザ標準の吹き出しで表示する）
    form.querySelector('button[type="submit"]').addEventListener('click', function () {
      // 前回のメッセージ（サーバー側のメッセージを含む）を消してから判定する
      errorArea.innerHTML = '';
      emailInput.setCustomValidity('');

      if (!emailInput.value.trim()) emailInput.setCustomValidity('メールアドレスを入力してください。');
    });
  });
</script>
{% endblock %}
