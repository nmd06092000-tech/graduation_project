{% extends 'layouts/base.html' %}

{% block layout %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-3">
                <div class="bg-primary text-white rounded-circle d-inline-flex p-3 mb-2">
                    <i class="bi bi-key fs-1"></i>
                </div>
                <h3 class="fw-bold">県民パスワードの再設定</h3>
                <p class="text-muted small">ご登録のメールアドレスと<br>新しいパスワードを入力してください。</p>
            </div>

            <!-- 画面側の入力チェックのエラー表示エリア -->
            <div id="input-errors"></div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form action="{{ url_for('auth.reset_password') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">メールアドレス</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="例) taro@example.com" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">新しいパスワード</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" id="new_password" name="new_password" class="form-control" placeholder="8文字以上で入力" minlength="8" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold">新しいパスワード（確認用）</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="もう一度入力してください" minlength="8" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">パスワードを変更する</button>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="{{ url_for('auth.login_citizen') }}" class="small text-muted text-decoration-none">← ログイン画面に戻る</a>
            </div>
        </div>
    </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.querySelector('form');
    const emailInput = form.elements['email'];
    const passwordInput = document.getElementById('new_password');
    const confirmInput = document.getElementById('confirm_password');
    const errorArea = document.getElementById('input-errors');

    // 未入力・文字数・一致チェック（ログイン画面と同じく、最初のエラー項目にブラウザ標準の吹き出しで表示する）
    form.querySelector('button[type="submit"]').addEventListener('click', function (event) {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirm = confirmInput.value;

      // 前回のメッセージを消してから判定する
      errorArea.innerHTML = '';
      [emailInput, passwordInput, confirmInput].forEach(function (input) { input.setCustomValidity(''); });

      // すべて未入力の場合は1つのメッセージにまとめて、送信せずに画面上部に表示する（ログイン画面と同じ）
      if (!email && !password && !confirm) {
        event.preventDefault();
        const alert = document.createElement('div');
        alert.className = 'alert alert-danger alert-dismissible fade show mb-3';
        alert.setAttribute('role', 'alert');
        alert.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i><span></span>'
            + '<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>';
        alert.querySelector('span').textContent = 'メールアドレス、新しいパスワードを入力してください。';
        errorArea.appendChild(alert);
        return;
      }
      if (!email) emailInput.setCustomValidity('メールアドレスを入力してください。');
      if (!password) passwordInput.setCustomValidity('新しいパスワードを入力してください。');
      else if (password.length < 8) passwordInput.setCustomValidity('このテキストは8文字以上で指定してください（現在は' + password.length + '文字です）。');
      if (!confirm) confirmInput.setCustomValidity('新しいパスワード（確認用）を入力してください。');
      else if (password.length >= 8 && password !== confirm) confirmInput.setCustomValidity('パスワードが一致しません。');
    });
  });
</script>
{% endblock %}
