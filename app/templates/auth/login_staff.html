{% extends 'layouts/base.html' %}

{% block layout %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <div class="bg-success text-white rounded-circle d-inline-flex p-3 mb-2">
                    <i class="bi bi-building fs-1"></i>
                </div>
                <h3 class="fw-bold">行政職員ログイン</h3>
                <p class="text-muted small">職員アカウントでログインしてください。</p>
            </div>

            <!-- エラーメッセージ表示エリア -->
            {% include 'components/_flash.html' %}
            <!-- 画面側の入力チェックのエラー表示エリア -->
            <div id="login-errors"></div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <!-- 未入力・文字数チェックは画面側（下の script）で行い、エラー時は送信しない（履歴に残さないため）。サーバー側でも同じチェックを行う -->
                    <form action="{{ url_for('auth.login_staff') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">職員ID</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                                <input type="text" 
                                       name="staff_id" 
                                       class="form-control" 
                                       placeholder="職員ID（@なし）" 
                                       pattern="[^@]*" 
                                       title="職員IDに @ は使用できません"
                                       oninput="this.setCustomValidity('')"
                                       oninvalid="if(this.value.includes('@')) this.setCustomValidity('職員IDに @ は使用できません。')">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold">パスワード</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <!-- minlength="8" を追加 -->
                                <input type="password" 
                                       name="password" 
                                       class="form-control" 
                                       placeholder="パスワードを入力してください" 
                                       minlength="8">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold">ログイン</button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="{{ url_for('auth.reset_password_staff') }}" class="small text-decoration-none">パスワードを忘れた方はこちら</a>
                    </div>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="{{ url_for('public.index') }}" class="small text-muted text-decoration-none">← トップページに戻る</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 未入力・文字数チェック（アカウント作成画面と同じく、最初のエラー項目にブラウザ標準の吹き出しで表示する）
    document.querySelector('form button[type="submit"]').addEventListener('click', function (event) {
        const form = this.form;
        const loginIdInput = form.elements['staff_id'];
        const passwordInput = form.elements['password'];
        const loginId = loginIdInput.value.trim();
        const password = passwordInput.value;
        const area = document.getElementById('login-errors');

        // 前回のメッセージを消してから判定する
        area.innerHTML = '';
        [loginIdInput, passwordInput].forEach(function (input) { input.setCustomValidity(''); });

        // すべて未入力の場合は1つのメッセージにまとめて、送信せずに画面上部に表示する
        if (!loginId && !password) {
            event.preventDefault();
            // サーバー側の flash も消してから表示する
            document.querySelectorAll('.alert').forEach(function (alert) { alert.remove(); });
            const alert = document.createElement('div');
            alert.className = 'alert alert-danger alert-dismissible fade show mb-3';
            alert.setAttribute('role', 'alert');
            alert.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i><span></span>'
                + '<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>';
            alert.querySelector('span').textContent = '職員IDまたはパスワードを入力してください';
            area.appendChild(alert);
            return;
        }
        if (!loginId) loginIdInput.setCustomValidity('職員IDを入力してください。');
        if (!password) passwordInput.setCustomValidity('パスワードを入力してください。');
        else if (password.length < 8) passwordInput.setCustomValidity('このテキストは8文字以上で指定してください（現在は' + password.length + '文字です）。');
    });
</script>
{% endblock %}
