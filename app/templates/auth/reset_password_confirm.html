{% extends 'layouts/base.html' %}

{# メールのリンクから開く新しいパスワードの入力画面（token はリンクの URL に含まれる） #}
{% block layout %}
<div class="container my-5 reset-password-container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-3">
                <div class="bg-primary text-white rounded-circle d-inline-flex p-3 mb-2">
                    <i class="bi bi-key fs-1"></i>
                </div>
                <h3 class="fw-bold">新しいパスワードの設定</h3>
                <p class="text-muted small">新しいパスワードを入力してください。</p>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <!-- メッセージ表示エリア（サーバー側のメッセージ・画面側の入力チェック） -->
                    <div id="input-errors">
                        {% include 'components/_flash.html' %}
                    </div>

                    <form action="{{ url_for('auth.reset_password_confirm', token=token) }}" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="new_password" class="form-label small fw-bold">新しいパスワード</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" id="new_password" name="new_password" class="form-control" placeholder="8文字以上で入力" minlength="8" autocomplete="new-password" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="confirm_password" class="form-label small fw-bold">新しいパスワード（確認用）</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="もう一度入力してください" minlength="8" autocomplete="new-password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">パスワードを変更する</button>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="{{ url_for('auth.login_citizen') }}" class="small text-muted text-decoration-none">← ログイン画面に戻る</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.querySelector('form');
    const passwordInput = document.getElementById('new_password');
    const confirmInput = document.getElementById('confirm_password');
    const errorArea = document.getElementById('input-errors');

    // 未入力・文字数・一致チェック（ログイン画面と同じく、ブラウザ標準の吹き出しで表示する）
    form.querySelector('button[type="submit"]').addEventListener('click', function () {
      const password = passwordInput.value;
      const confirm = confirmInput.value;

      // 前回のメッセージ（サーバー側のメッセージを含む）を消してから判定する
      errorArea.innerHTML = '';
      [passwordInput, confirmInput].forEach(function (input) { input.setCustomValidity(''); });

      if (!password) passwordInput.setCustomValidity('パスワードを入力してください。');
      else if (password.length < 8) passwordInput.setCustomValidity('このテキストは8文字以上で入力してください（現在は' + password.length + '文字です）。');
      if (!confirm) confirmInput.setCustomValidity('パスワードを入力してください。');
      else if (password.length >= 8 && password !== confirm) confirmInput.setCustomValidity('パスワードが一致しません。');
    });
  });
</script>
{% endblock %}
