{% extends 'layouts/base.html' %}

{# メールのリンクから開く確認画面（token はリンクの URL に含まれる。ボタンを押すまでパスワードは変更されない） #}
{% block layout %}
<div class="container my-5 reset-password-container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-3">
                <div class="bg-primary text-white rounded-circle d-inline-flex p-3 mb-2">
                    <i class="bi bi-key fs-1"></i>
                </div>
                <h3 class="fw-bold">パスワード変更の確認</h3>
                <p class="text-muted small">新しいパスワードを有効にするには、下のボタンを押してください。<br>心当たりがない場合は、このページを閉じてください。</p>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <!-- メッセージ表示エリア（サーバー側のメッセージ） -->
                    <div id="input-errors">
                        {% include 'components/_flash.html' %}
                    </div>

                    <form action="{{ url_for('auth.reset_password_confirm', token=token) }}" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">パスワードの変更を確定する</button>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="{{ url_for('auth.login_citizen') }}" class="small text-muted text-decoration-none">← ログイン画面に戻る</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
