{% extends 'layouts/base.html' %}

{% block layout %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-3">
                <div class="bg-secondary text-white rounded-circle d-inline-flex p-3 mb-2">
                    <i class="bi bi-key fs-1"></i>
                </div>
                <h3 class="fw-bold">管理者パスワードの再設定</h3>
                <p class="text-muted small">管理者IDと新しいパスワードを入力してください。</p>
            </div>

            <!-- サーバー側チェックのエラー表示エリア（flash と同じ見た目。route は error か flash のどちらか一方のみ渡す） -->
            {% if error %}
                <div class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% else %}
                {% include 'components/_flash.html' %}
            {% endif %}

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form action="{{ url_for('auth.reset_password_admin') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">管理者ID</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-badge-fill"></i></span>
                                <!-- pattern・title・JavaScriptでブラウザ標準吹き出しエラーを表示 -->
                                <input type="text" 
                                       name="admin_id" 
                                       class="form-control" 
                                       placeholder="例) admin_master" 
                                       pattern="[^@]*" 
                                       title="管理者IDに @ は使用できません" 
                                       oninput="this.setCustomValidity('')"
                                       oninvalid="if(this.value.includes('@')) this.setCustomValidity('管理者IDに @ は使用できません。')"
                                       required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">新しいパスワード</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <!-- ① minlength="8" により、8文字未満のときにブラウザ標準のエラー（「このテキストを長くして...」）が表示される -->
                                <input type="password" id="new_password" name="new_password" class="form-control" placeholder="8文字以上で入力" minlength="8" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold">新しいパスワード（確認用）</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="もう一度入力してください" minlength="8" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-secondary w-100 py-2 fw-bold">パスワードを変更する</button>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="{{ url_for('auth.login_admin') }}" class="small text-muted text-decoration-none">← ログイン画面に戻る</a>
            </div>
        </div>
    </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const passwordInput = document.getElementById('new_password');
    const confirmInput = document.getElementById('confirm_password');

    function checkPasswordMatch() {
      // ② 新しいパスワードが8文字未満（文字数不足）の場合は、ブラウザ標準のエラーを優先させるため判定を行わない
      if (passwordInput.validity.tooShort) {
        confirmInput.setCustomValidity('');
        return;
      }

      // 8文字以上ある場合のみ、一致チェックを行う
      if (confirmInput.value && passwordInput.value !== confirmInput.value) {
        confirmInput.setCustomValidity('パスワードが一致しません。');
      } else {
        confirmInput.setCustomValidity('');
      }
    }

    passwordInput.addEventListener('input', checkPasswordMatch);
    confirmInput.addEventListener('input', checkPasswordMatch);
  });
</script>
{% endblock %}
