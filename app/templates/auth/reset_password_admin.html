{% extends 'layouts/base.html' %}

{% block layout %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-3">
                <div class="bg-secondary text-white rounded-circle d-inline-flex p-3 mb-2">
                    <i class="bi bi-key fs-1"></i>
                </div>
                <h3 class="fw-bold">管理者パスワードの再設定</h3>
                <p class="text-muted small">管理者ID、再設定コード、新しいパスワードを入力してください。</p>
            </div>

            <!-- サーバー側チェックのエラー表示エリア（ID・コードの誤りは存在を知らせない共通の文言） -->
            {% include 'components/_flash.html' %}
            <!-- 画面側の入力チェックのエラー表示エリア -->
            <div id="input-errors"></div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form action="{{ url_for('auth.reset_password_admin') }}" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="login_id" class="form-label small fw-bold">管理者ID</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-badge-fill"></i></span>
                                <!-- pattern・title・JavaScriptでブラウザ標準吹き出しエラーを表示 -->
                                <input type="text"
                                       id="login_id"
                                       name="login_id"
                                       class="form-control"
                                       placeholder="例) admin_master"
                                       pattern="[^@]*"
                                       title="管理者IDに @ は使用できません"
                                       autocomplete="username"
                                       value="{{ login_id or '' }}"
                                       oninput="this.setCustomValidity('')"
                                       oninvalid="if(this.value.includes('@')) this.setCustomValidity('管理者IDに @ は使用できません。')"
                                       required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="reset_code" class="form-label small fw-bold">再設定コード</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                                <!-- コードは1回限り・短時間のみ有効なので、入力内容は再表示しない -->
                                <input type="text" id="reset_code" name="reset_code" class="form-control" placeholder="システム管理者から受け取ったコード" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" required>
                            </div>
                            <div class="form-text">再設定コードはシステム管理者から受け取ってください。</div>
                        </div>
                        <div class="mb-3">
                            <label for="new_password" class="form-label small fw-bold">新しいパスワード</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <!-- 8文字未満のときは、下の script で文字数エラーを吹き出しに表示する -->
                                <input type="password" id="new_password" name="new_password" class="form-control" placeholder="8文字以上で入力" minlength="8" autocomplete="new-password" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="confirm_password" class="form-label small fw-bold">新しいパスワード（確認用）</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="もう一度入力してください" minlength="8" autocomplete="new-password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-secondary w-100 py-2 fw-bold">パスワードを変更する</button>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="{{ url_for('auth.login_admin') }}" class="small text-muted text-decoration-none">← ログイン画面に戻る</a>
            </div>
        </div>
    </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.querySelector('form');
    const idInput = form.elements['login_id'];
    const codeInput = form.elements['reset_code'];
    const passwordInput = document.getElementById('new_password');
    const confirmInput = document.getElementById('confirm_password');
    const errorArea = document.getElementById('input-errors');

    // 未入力・文字数・一致チェック（ログイン画面と同じく、最初のエラー項目にブラウザ標準の吹き出しで表示する）
    // @ のチェックは管理者ID欄の pattern・oninvalid で行う
    form.querySelector('button[type="submit"]').addEventListener('click', function (event) {
      const adminId = idInput.value.trim();
      const code = codeInput.value.trim();
      const password = passwordInput.value;
      const confirm = confirmInput.value;

      // 前回のメッセージを消してから判定する
      errorArea.innerHTML = '';
      [idInput, codeInput, passwordInput, confirmInput].forEach(function (input) { input.setCustomValidity(''); });

      // すべて未入力の場合は1つのメッセージにまとめて、送信せずに画面上部に表示する（ログイン画面と同じ）
      if (!adminId && !code && !password && !confirm) {
        event.preventDefault();
        // サーバー側のエラー（flash）も消してから表示する
        document.querySelectorAll('.alert').forEach(function (alert) { alert.remove(); });
        const alert = document.createElement('div');
        alert.className = 'alert alert-danger alert-dismissible fade show mb-3';
        alert.setAttribute('role', 'alert');
        alert.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i><span></span>'
            + '<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>';
        alert.querySelector('span').textContent = '管理者ID、再設定コード、新しいパスワードを入力してください。';
        errorArea.appendChild(alert);
        return;
      }
      if (!adminId) idInput.setCustomValidity('管理者IDを入力してください。');
      if (!code) codeInput.setCustomValidity('再設定コードを入力してください。');
      if (!password) passwordInput.setCustomValidity('新しいパスワードを入力してください。');
      else if (password.length < 8) passwordInput.setCustomValidity('このテキストは8文字以上で指定してください（現在は' + password.length + '文字です）。');
      if (!confirm) confirmInput.setCustomValidity('新しいパスワード（確認用）を入力してください。');
      // 新しいパスワードが8文字以上ある場合のみ、一致チェックを行う
      else if (password.length >= 8 && password !== confirm) confirmInput.setCustomValidity('パスワードが一致しません。');
    });
  });
</script>
{% endblock %}
