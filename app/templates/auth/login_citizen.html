{% extends 'layouts/base.html' %}

{% block layout %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex p-3 mb-2">
                    <i class="bi bi-person-fill fs-1"></i>
                </div>
                <h3 class="fw-bold">市民ログイン</h3>
                <p class="text-muted small">登録したメールアドレスとパスワードを入力してください。</p>
            </div>

            <!-- エラーメッセージ表示エリア -->
            {% include 'components/_flash.html' %}

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form action="{{ url_for('auth.login_citizen') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">メールアドレス</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="例) taro@example.com" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">パスワード</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="パスワードを入力してください" minlength="8" required>
                            </div>
                        </div>
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember">
                            <label class="form-check-label small" for="remember">ログイン状態を保持する</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">ログイン</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{{ url_for('auth.reset_password') }}" class="small text-decoration-none">パスワードを忘れた方はこちら</a>
                    </div>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="{{ url_for('public.index') }}" class="small text-muted text-decoration-none">← トップページに戻る</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
