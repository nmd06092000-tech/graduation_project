{% extends 'layouts/base.html' %}

{% block layout %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex p-3 mb-2">
                    <i class="bi bi-person-fill fs-1"></i>
                </div>
                <h3 class="fw-bold">県民ログイン</h3>
                <p class="text-muted small">登録したメールアドレスとパスワードを入力してください。</p>
            </div>

            <!-- エラーメッセージ表示エリア -->
            {% include 'components/_flash.html' %}
            <!-- 画面側の入力チェックのエラー表示エリア -->
            <div id="login-errors"></div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <!-- 未入力・文字数チェックは画面側（下の script）で行い、エラー時は送信しない（履歴に残さないため）。サーバー側でも同じチェックを行う -->
                    <form action="{{ url_for('auth.login_citizen') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">メールアドレス</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="例) taro@example.com">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">パスワード</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="パスワードを入力してください" minlength="8">
                            </div>
                        </div>
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember">
                            <label class="form-check-label small" for="remember">ログイン状態を保持する</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">ログイン</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{{ url_for('auth.reset_password') }}" class="small text-decoration-none">パスワードを忘れた方はこちら</a>
                    </div>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="{{ url_for('public.index') }}" class="small text-muted text-decoration-none">← トップページに戻る</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 未入力・文字数チェック（アカウント作成画面と同じく、最初のエラー項目にブラウザ標準の吹き出しで表示する）
    document.querySelector('form button[type="submit"]').addEventListener('click', function (event) {
        const form = this.form;
        const loginIdInput = form.elements['email'];
        const passwordInput = form.elements['password'];
        const loginId = loginIdInput.value.trim();
        const password = passwordInput.value;
        const area = document.getElementById('login-errors');

        // 前回のメッセージを消してから判定する
        area.innerHTML = '';
        [loginIdInput, passwordInput].forEach(function (input) { input.setCustomValidity(''); });

        // すべて未入力の場合は1つのメッセージにまとめて、送信せずに画面上部に表示する
        if (!loginId && !password) {
            event.preventDefault();
            // サーバー側の flash も消してから表示する
            document.querySelectorAll('.alert').forEach(function (alert) { alert.remove(); });
            const alert = document.createElement('div');
            alert.className = 'alert alert-danger alert-dismissible fade show mb-3';
            alert.setAttribute('role', 'alert');
            alert.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i><span></span>'
                + '<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>';
            alert.querySelector('span').textContent = 'メールアドレスまたはパスワードを入力してください';
            area.appendChild(alert);
            return;
        }
        if (!loginId) loginIdInput.setCustomValidity('メールアドレスを入力してください。');
        if (!password) passwordInput.setCustomValidity('パスワードを入力してください。');
        else if (password.length < 8) passwordInput.setCustomValidity('このテキストは8文字以上で指定してください（現在は' + password.length + '文字です）。');
    });
</script>
{% endblock %}
