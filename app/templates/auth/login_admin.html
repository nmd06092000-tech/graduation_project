{% extends 'layouts/base.html' %}

{% block layout %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-3">
                <div class="bg-secondary text-white rounded-circle d-inline-flex p-3 mb-2">
                    <i class="bi bi-gear-fill fs-1"></i>
                </div>
                <h3 class="fw-bold">管理者ログイン</h3>
                <p class="text-muted small">管理者アカウントでログインしてください。</p>
            </div>

            <!-- エラーメッセージ表示エリア -->
            {% include 'components/_flash.html' %}

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form action="{{ url_for('auth.login_admin') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">管理者ID</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-badge-fill"></i></span>
                                <input type="text" 
                                       name="admin_id" 
                                       class="form-control" 
                                       placeholder="例) admin01" 
                                       pattern="[^@]*" 
                                       title="管理者IDに @ は使用できません" 
                                       oninput="this.setCustomValidity('')"
                                       oninvalid="if(this.value.includes('@')) this.setCustomValidity('管理者IDに @ は使用できません。')"
                                       required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold">パスワード</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" 
                                       name="password" 
                                       class="form-control" 
                                       placeholder="パスワードを入力してください" 
                                       minlength="8" 
                                       required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-secondary w-100 py-2 fw-bold">ログイン</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{{ url_for('auth.reset_password_admin') }}" class="small text-decoration-none">パスワードを忘れた方はこちら</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
